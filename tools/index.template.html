<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100f18"><meta name="description" content="Una expedición de estudio entre ruinas y conocimiento."><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><title>Umbral del Saber</title></head><body><div id="app"></div><script>function startupError(reason){const app=document.getElementById('app');if(!app||app.childElementCount)return;const box=document.createElement('main');box.style.cssText='max-width:660px;margin:12vh auto;padding:32px;color:#eee8dc;background:#211e2e;border:1px solid #b88857;font:18px/1.6 Georgia';const h=document.createElement('h1');h.textContent='El juego no pudo iniciar';const p=document.createElement('p');p.textContent='Recarga la página. Si el problema continúa, publica de nuevo todos los archivos del ZIP y revisa la consola del navegador.';const detail=document.createElement('small');detail.textContent=String(reason||'Error de carga');box.append(h,p,detail);app.append(box)}window.addEventListener('error',e=>startupError(e.message));window.addEventListener('unhandledrejection',e=>startupError(e.reason?.message||e.reason));setTimeout(()=>startupError('La interfaz no respondió en 5 segundos.'),5000);</script><script>/* GAME_BUNDLE */</script></body></html>
